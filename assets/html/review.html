<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS 실력의힘 간식뽑기 프로그램</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="review">

  <!-- 별 배경 -->
  <div id="starField"></div>

  <!-- 로딩 오버레이 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">데이터 불러오는 중...</div>
  </div>

  <!-- <video autoplay muted loop playsinline id="bgVideo">
    <source src="../../images/monthly_bg.mp4" type="video/mp4">
    브라우저가 video 태그를 지원하지 않습니다.
  </video> -->


    <img src="../../images/logo_white.png" id="siteLogo" alt="실력의힘" />
    <div id="tabbar">
      <div class="tab-group">
        <a href="../../index.html" class="tab-item"><span class="tab-icon">📅</span><span class="tab-label">Daily</span></a>
        <a href="monthly.html" class="tab-item"><span class="tab-icon">📆</span><span class="tab-label">Monthly</span></a>
        <a class="tab-item active"><span class="tab-icon">⭐</span><span class="tab-label">Review</span></a>
      </div>
      <div class="tab-divider"></div>
      <div class="tab-group">
        <button id="fullscreenBtn" class="tab-item"><span class="tab-icon">⛶</span><span class="tab-label">전체화면</span></button>
        <button id="showHistoryBtn" class="tab-item"><span class="tab-icon">📋</span><span class="tab-label">기록</span></button>
      </div>
    </div>


    
    <div class="container">
        <h1 id="Title">⭐ Review 상품 뽑기</h1>
        <div id="slotWrapper" class="card">
            <div id="slot">
              <!-- 항목들이 자동으로 생성됩니다 -->
            </div>
          </div>


          <button id="startBtn" class="start-btn">
            <img src="../../images/start_btn.png" alt="뽑기 시작" />
          </button>
        
        <div id="historyModal" class="modal hidden">
          <div class="modal-box">
            <div class="modal-header">
              <span class="modal-title">📜 뽑기 기록</span>
              <button id="closeHistoryBtn" class="modal-close">✕</button>
            </div>
            <div class="history-scroll">
              <ul id="history2" class="history-list"></ul>
            </div>
          </div>
        </div>


      <script src="../js/review.js"></script>
      <script src="../js/stars.js"></script>
</body>
</html>
